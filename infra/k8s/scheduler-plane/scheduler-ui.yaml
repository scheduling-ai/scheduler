apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-ui
  namespace: scheduler-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-ui
  template:
    metadata:
      labels:
        app: scheduler-ui
    spec:
      containers:
        - name: ui
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["uv", "run", "--frozen", "--no-sync", "scheduler-ui"]
          env:
            # Live-mode source list.  Each entry is one bridge instance the
            # UI dropdown can switch between.  Adding a third source =
            # one more JSON entry + one more bridge Deployment.
            - name: BRIDGE_SOURCES
              value: |
                [
                  {"name": "solver",   "label": "Observer + MILP controller in fully controlled cluster", "shortLabel": "MILP-controlled",   "url": "http://k8s-bridge:8080"},
                  {"name": "observed", "label": "Observer in Kueue cluster",                              "shortLabel": "Kueue (observed)", "url": "http://k8s-bridge-observed:8080"}
                ]
            - name: GENERATOR_URL
              value: http://load-generator:8100
            - name: PORT
              value: "8000"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENV
              value: production
            - name: GIT_SHA
              value: "${GIT_SHA}"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-ui
  namespace: scheduler-system
spec:
  # ClusterIP: the in-cluster Pomerium Deployment is the only thing that
  # talks to this Service. If you drop Pomerium, switch this to LoadBalancer.
  type: ClusterIP
  selector:
    app: scheduler-ui
  ports:
    - name: http
      port: 80
      targetPort: http
