apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-ui
  namespace: scheduler-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-ui
  template:
    metadata:
      labels:
        app: scheduler-ui
    spec:
      containers:
        - name: ui
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["uv", "run", "--frozen", "--no-sync", "scheduler-ui"]
          env:
            # Live-mode source list.  Each entry is one bridge instance the
            # UI dropdown can switch between.  Adding a third source =
            # one more JSON entry + one more bridge Deployment.
            # Order matters: the first entry is the default the
            # customer UI lands on.  Kueue first so the demo opens on
            # the realistic "observer next to your existing Kueue
            # install" surface.
            - name: BRIDGE_SOURCES
              value: |
                [
                  {"name": "observed", "label": "Observer in Kueue cluster",                              "shortLabel": "Kueue (observed)", "url": "http://k8s-bridge-observed:8080"},
                  {"name": "solver",   "label": "Observer + MILP controller in fully controlled cluster", "shortLabel": "MILP-controlled",   "url": "http://k8s-bridge:8080"}
                ]
            - name: GENERATOR_URL
              value: http://load-generator:8100
            # Customer install: only the customer UI at `/` is reachable.
            # Every /dev/* URL (chooser, replay, generator) and every
            # dev-only handler (/api/solvers, /api/solve, /scenarios,
            # /api/generator/config, /state/config.json, /api/jobs) 404
            # server-side.  Unset locally (`npm run dev`, `uv run
            # scheduler-ui`, `docker compose up`) so the dev tools come
            # back.
            - name: UI_PRODUCTION
              value: "1"
            - name: PORT
              value: "8000"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENV
              value: production
            - name: GIT_SHA
              value: "${GIT_SHA}"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-ui
  namespace: scheduler-system
spec:
  # ClusterIP: the in-cluster Pomerium Deployment is the only thing that
  # talks to this Service. If you drop Pomerium, switch this to LoadBalancer.
  type: ClusterIP
  selector:
    app: scheduler-ui
  ports:
    - name: http
      port: 80
      targetPort: http
