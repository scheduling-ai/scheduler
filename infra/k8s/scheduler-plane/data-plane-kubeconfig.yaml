# Kubeconfig the bridge mounts to reach each data-plane cluster.
#
# This is a ConfigMap (no secrets) because the token is not embedded:
# every entry uses `tokenFile` pointing at the pod's mounted ServiceAccount
# token. For the MVP that token is issued by the co-located cluster itself
# and is therefore valid against its own API server (SA `scheduler-system/
# scheduler`, RBAC installed by `infra/k8s/data-plane/scheduler-rbac.yaml`).
#
# Adding a second data-plane cluster = convert this to a Secret with an
# explicit bearer token / client-cert / `exec` credential plugin per
# cluster entry, and append a matching `--cluster` flag to the bridge
# Deployment below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-plane-kubeconfig
  namespace: scheduler-system
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: local
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: scheduler
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: local
        context:
          cluster: local
          user: scheduler
    current-context: local
