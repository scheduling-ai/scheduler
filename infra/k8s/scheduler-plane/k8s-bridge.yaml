apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-bridge
  namespace: scheduler-system
spec:
  replicas: 1
  # In-memory workload store is the source of truth — never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-bridge
  template:
    metadata:
      labels:
        app: k8s-bridge
    spec:
      serviceAccountName: scheduler
      containers:
        - name: bridge
          image: ${IMAGE}
          imagePullPolicy: Always
          command:
            - /usr/local/bin/k8s-bridge
            - serve
            - --cluster
            - local:local
            - --chip-count-label
            - scheduler.example.com/chips
            - --chips-annotation
            - scheduler.example.com/chips-per-replica
            - --taint-key
            - scheduler.example.com/managed
            - --taint-value
            - "true"
            - --solver
            - milp
            - --port
            - "8080"
          env:
            - name: KUBECONFIG
              value: /etc/kubeconfig/config
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: kubeconfig
          configMap:
            name: data-plane-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-bridge
  namespace: scheduler-system
spec:
  selector:
    app: k8s-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
