apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-bridge
  namespace: scheduler-system
spec:
  replicas: 1
  # In-memory workload store is the source of truth — never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-bridge
  template:
    metadata:
      labels:
        app: k8s-bridge
    spec:
      serviceAccountName: scheduler
      # No toleration for scheduler.example.com/managed — chip pools carry
      # that taint, and we want this off the chip nodes so we never starve
      # an e2-micro kubelet. The system pool is untainted.
      containers:
        - name: bridge
          image: ${IMAGE}
          imagePullPolicy: Always
          command:
            - /usr/local/bin/k8s-bridge
            - serve
            - --mode
            - schedule
            - --cluster
            - local:local
            - --chip-count-label
            - scheduler.example.com/chips
            - --chips-annotation
            - scheduler.example.com/chips-per-replica
            - --taint-key
            - scheduler.example.com/managed
            - --taint-value
            - "true"
            - --require-taint
            - --solver
            - milp
            - --quotas
            - /etc/quotas/quotas.json
            - --port
            - "8080"
          env:
            - name: KUBECONFIG
              value: /etc/kubeconfig/config
            - name: RUST_LOG
              value: info
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENV
              value: production
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: SENTRY_DEBUG
              value: "${SENTRY_DEBUG}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
            - name: quotas
              mountPath: /etc/quotas
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: kubeconfig
          configMap:
            name: data-plane-kubeconfig
        - name: quotas
          configMap:
            name: scheduler-quotas
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-bridge
  namespace: scheduler-system
spec:
  selector:
    app: k8s-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
