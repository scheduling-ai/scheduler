services:
  # Postgres for the workload store.  Used only by `k8s-bridge serve` (run
  # locally against a kind cluster), not by the simulator stack below — but
  # we run it here so a single `docker compose up` covers the full local
  # development surface.  Cost is ~50 MB RAM idle.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      main: {}

  scheduler-ui:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["uv", "run", "--frozen", "--no-sync", "scheduler-ui"]
    ports:
      - "8000:8000"
    depends_on:
      loop-runner-service:
        condition: service_healthy
    environment:
      SENTRY_DSN: ${SENTRY_DSN}
      # Tag local docker-compose runs as "local" so they don't pollute the
      # production environment in Sentry.
      SENTRY_ENV: ${SENTRY_ENV:-local}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ./.scheduler-live-state:/data/live-state
    restart: always
    networks:
      main:
        aliases:
          - scheduler-ui

  loop-runner-service:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["uv", "run", "--frozen", "--no-sync", "loop-runner"]
    healthcheck:
      test: ["CMD", "python", "-c", "import glob, os, time; files = glob.glob('/data/live-state/latest-*.json'); assert files and time.time() - max(os.path.getmtime(f) for f in files) < 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENV: ${SENTRY_ENV:-local}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ./.scheduler-live-state:/data/live-state
    restart: always

networks:
  main: {}

volumes:
  postgres-data: {}
