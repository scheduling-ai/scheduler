[package]
name = "k8s-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
k8s-openapi = { version = "0.27", features = ["v1_33"] }
kube = { version = "3", features = ["runtime", "client", "derive"] }
indexmap = { version = "2", features = ["serde"] }
# rustls so the static binary doesn't depend on a system openssl. kube already
# uses rustls; matching that here avoids dragging in libssl via the Sentry
# transport's default native-tls.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
